name: CD - AWS ECS Fargate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECS_STACK: fastapi-react-production
  ECS_PROJECT: fastapi-react

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"bearer {token}"
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.loads(response.read())

          jwt = data["value"]

          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("issuer   =", claims.get("iss"))
          print("aud      =", claims.get("aud"))
          print("sub      =", claims.get("sub"))
          print("repo     =", claims.get("repository"))
          print("owner    =", claims.get("repository_owner"))
          print("repo_id  =", claims.get("repository_id"))
          print("owner_id =", claims.get("repository_owner_id"))
          print("ref      =", claims.get("ref"))
          print("env      =", claims.get("environment"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::797882812918:role/GitHubActions-ECS-Deploy-Role
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy
        run: |
          chmod +x deploy/ecs/deploy.sh
          ./deploy/ecs/deploy.sh